name: Deploy Node.js App to Windows Server

on:
  push:
    branches: [main]  # Change to your branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: npm install

    - name: Run tests (if any)
      run: npm test || echo "No tests"

    - name: Deploy to Windows Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.WINDOWS_HOST }}
        username: ${{ secrets.WINDOWS_USERNAME }}
        password: ${{ secrets.WINDOWS_PASSWORD }}
        port: 22
        script: |
          cd C:\apps\node-server
          git pull origin main
          npm install
          pm2 restart node-app
