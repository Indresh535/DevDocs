global:
  scrape_interval: 2s  # Collect metrics every 2 seconds

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "worker_threads"
    static_configs:
      - targets: ["localhost:3001"]  # Worker Threads App

  - job_name: "promise_app"
    static_configs:
      - targets: ["localhost:3002"]  # Promises App
