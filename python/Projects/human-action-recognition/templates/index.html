<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human Action Recognition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f8;
        }
        .container {
            margin-top: 60px;
            max-width: 700px;
        }
        .card {
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            background-color: white;
        }
        h1 {
            margin-bottom: 20px;
            font-weight: 600;
        }
        video {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1 class="text-center text-primary">Human Action Recognition</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="video" class="form-label">Upload a Video File</label>
                <input class="form-control" type="file" name="video" id="video" accept="video/*" required>
            </div>
            <div class="d-grid">
                <button class="btn btn-success" type="submit">Upload & Recognize</button>
            </div>
        </form>

        {% if prediction %}
            <hr>
            <h3 class="text-center mt-4">🔍 Predicted Action: <span class="text-success">{{ prediction }}</span></h3>
            <video class="w-100" controls>
                <source src="{{ url_for('static', filename='output.mp4') }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        {% endif %}
    </div>
</div>

<!-- Bootstrap 5 JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
