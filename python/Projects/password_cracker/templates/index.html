<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Cracking Simulator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1 class="text-center">🔐 Password Cracking Simulator</h1>
  <div class="card p-4">
    <form id="crack-form">
      <div class="mb-3">
        <label for="password" class="form-label">Enter Password:</label>
        <input type="text" class="form-control" id="password" name="password" required>
      </div>
      <div class="mb-3">
        <label for="attack_type" class="form-label">Select Attack Type:</label>
        <select class="form-select" id="attack_type" name="attack_type">
          <option value="brute_force">Brute Force Attack</option>
          <option value="dictionary">Dictionary Attack</option>
          <option value="smart_dictionary">Smart Dictionary Attack</option>
          <option value="masked">Masked Attack (e.g., a99)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Start Cracking</button>
    </form>
  </div>

  <div id="result" class="mt-4"></div>

  <div class="mt-5">
    <h4>📚 About Cracking Techniques</h4>
    <ul>
      <li><strong>Brute-force:</strong> Try every possible combination.</li>
      <li><strong>Dictionary Attack:</strong> Try from list of common passwords.</li>
      <li><strong>Smart Dictionary:</strong> Mutations (e.g., password123, P@ssw0rd).</li>
      <li><strong>Masked Attack:</strong> Guess based on patterns (like a99, b01).</li>
    </ul>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
