<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Classification with NLP</title>
    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Poppins', sans-serif;
      }
      body {
          background: linear-gradient(135deg, #007bff, #6610f2);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          color: #fff;
          text-align: center;
      }
      .container {
          background: rgba(255, 255, 255, 0.9);
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          width: 450px;
          text-align: center;
          animation: fadeIn 1s ease-in-out;
      }
      h2 {
          color: #333;
          margin-bottom: 20px;
      }
      textarea {
          width: 100%;
          padding: 12px;
          border-radius: 10px;
          border: 1px solid #ccc;
          font-size: 16px;
          resize: none;
          margin-bottom: 15px;
      }
      input[type=submit] {
          width: 100%;
          padding: 14px;
          background: #007bff;
          color: white;
          border: none;
          border-radius: 10px;
          font-size: 18px;
          cursor: pointer;
          transition: 0.3s;
      }
      input[type=submit]:hover {
          background: #0056b3;
      }
      footer {
          margin-top: 20px;
          font-size: 14px;
          opacity: 0.8;
      }
      @keyframes fadeIn {
          from { opacity: 0; transform: translateY(-20px); }
          to { opacity: 1; transform: translateY(0); }
      }
  </style>
</head>

<body>
    <div class="container">
        <h2>News Classification with NLP</h2>
        <br>
        {% if data : %}
        <h3 style="color:#6610f2">Your information is related to </h3><h2 style="color:{{data[1]}}">{{data[0]}}</h2>
        {% endif %}

        <form action="/newsClassifier">
            <input type="submit" value="Back" name="newsClassifier" id="newsClassifier">
        </form>
    </div>

    <footer>
      <p>&copy; 2025 | AI News NLP Classifier | Powered by Machine Learning</p>
    </footer>


</body>

</html>
