<!DOCTYPE html>
<html>
<head>
    <title>Ask AI</title>
</head>
<body>
    <h1>Ask a Question</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Ask</button>
    </form>
    {% if answer %}
        <h2>Answer:</h2>
        <p>{{ answer }}</p>
    {% endif %}
    <a href="{% url 'home' %}">Back</a>
</body>
</html>
